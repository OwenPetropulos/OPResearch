name: Update Market Data

on:
  schedule:
    # Morning update: 10:45 UTC = ~6:45 AM ET (approx, ignoring DST)
    - cron: "45 10 * * 1-5"
    # After-close update: 21:45 UTC = ~5:45 PM ET (approx, ignoring DST)
    - cron: "45 21 * * 1-5"
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI at any time

jobs:
  update-data:
    name: Generate and commit updated JSON data
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to push commits back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run data pipeline
        run: |
          python scripts/run_all.py
        env: 
          OPR_DATA_DIR: dashboard/data
        # Pipeline runs all generators and prints a summary.
        # Individual script failures are logged but do not abort the job
        # unless run_all.py itself exits with code 1 (all failures).
        # We use continue-on-error: false so partial failures still surface.

      - name: Check for changes in /data
        id: check_changes
        run: |
          git diff --quiet data/ || echo "changes=true"

      - name: Commit and push updated data files
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/dashboard/data/
          git commit -m "chore: update market data [$(date -u +'%Y-%m-%d %H:%M UTC')]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: No changes — skipping commit
        if: steps.check_changes.outputs.changes != 'true'
        run: echo "No data changes detected. Skipping commit."
