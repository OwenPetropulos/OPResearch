name: OPResearch Data Pipeline

on:
  schedule:
    # Run 3x daily: 9:00 AM, 12:30 PM, 4:30 PM ET
    # Convert to UTC: 2:00 PM, 5:30 PM (same day), 9:30 PM (same day)
    - cron: '0 14 * * 1-5'      # 2:00 PM UTC (9:00 AM ET) on weekdays
    - cron: '30 17 * * 1-5'     # 5:30 PM UTC (12:30 PM ET) on weekdays
    - cron: '30 21 * * 1-5'     # 9:30 PM UTC (4:30 PM ET) on weekdays
    
    # Monday-only: Earnings calendar refresh at 9:00 AM ET (2:00 PM UTC)
    - cron: '0 14 * * 1'        # 2:00 PM UTC (9:00 AM ET) on Mondays only
  
  # Allow manual trigger
  workflow_dispatch:

jobs:
  data-pipeline:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance feedparser requests
      
      - name: Run data pipeline
        working-directory: ./scripts
        run: python run_all.py
        env:
          MARKETAUX_API_KEY: ${{ secrets.MARKETAUX_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      
      - name: Check for changes
        id: check-changes
        run: |
          if git diff --quiet docs/dashboard/data/; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit and push changes
        if: steps.check-changes.outputs.changes == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "OPResearch Pipeline"
          git add docs/dashboard/data/
          git commit -m "chore: update market data via pipeline [skip ci]"
          git push
      
      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Pipeline run failed. Check logs above."
          exit 1
